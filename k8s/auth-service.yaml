apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nomina-ccsa
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: nomina-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: nomina-ccsa/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: AUTH_PORT
              valueFrom:
                configMapKeyRef:
                  name: nomina-config
                  key: AUTH_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nomina-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nomina-config
                  key: NODE_ENV
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: db-storage
              mountPath: /app/server
      volumes:
        - name: db-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nomina-ccsa
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: nomina-system
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
      name: http
