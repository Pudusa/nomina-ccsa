apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomina-monolith
  namespace: nomina-ccsa
  labels:
    app.kubernetes.io/name: nomina-monolith
    app.kubernetes.io/part-of: nomina-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nomina-monolith
  template:
    metadata:
      labels:
        app: nomina-monolith
    spec:
      containers:
        - name: nomina-monolith
          image: nomina-ccsa/monolith:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: nomina-config
                  key: PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nomina-config
                  key: AUTH_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nomina-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nomina-config
                  key: NODE_ENV
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: db-storage
              mountPath: /app/server
      volumes:
        - name: db-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: nomina-monolith
  namespace: nomina-ccsa
  labels:
    app.kubernetes.io/name: nomina-monolith
    app.kubernetes.io/part-of: nomina-system
spec:
  type: NodePort
  selector:
    app: nomina-monolith
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
      name: http
